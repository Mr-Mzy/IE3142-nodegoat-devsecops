
name: E2E Test

on: [push, pull_request]

jobs:
  e2e-test:
    name: E2E Tests - Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["10.x", "12.x", "14.x"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cypress
        run: npm run cy:verify

      - name: Start MongoDB
        run: |
          docker run -d --name e2e-mongo -p 27017:27017 mongo:4.4
          timeout 60s bash -c 'until nc -z localhost 27017; do sleep 2; done'
          echo "MongoDB is ready"

      - name: Run E2E test suite
        id: test-suite
        run: |
          NODE_ENV=test npm start > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/ > /dev/null; then
              echo "NodeGoat is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:4000/ > /dev/null
          npm run test:ci -- --config video=true

      - name: Upload Cypress artifacts
        if: failure() && steps.test-suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-node${{ matrix.node-version }}
          path: |
            test/e2e/screenshots
            test/e2e/videos
            app.log
          if-no-files-found: ignore
